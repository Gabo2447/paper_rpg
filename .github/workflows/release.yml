name: Publish Release Artifact

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          server-username: ${{ github.actor }}
          server-password: ${{ secrets.READ_PACKAGES_PAT }}

      - name: Build with Maven
        run: ./mvnw clean package --batch-mode

      - name: Prepare Release Binary
        run: |
          mkdir -p dist
          cp code/build/target/"SoulBound Build.jar" dist/SoulBound-${{ github.ref_name }}.jar

      - name: Attach JAR to Github Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
